name: MassiDeck

# Costruisce il programma per Windows e l'app Android e li mette nella pagina Releases (tag "app"):
#   https://github.com/massxxx/massideck/releases/latest/download/MassiDeck.exe
#   https://github.com/massxxx/massideck/releases/latest/download/MassiDeck.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app
  cancel-in-progress: true

env:
  CAP: '6.2.0'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prova del programma su Windows
        shell: pwsh
        run: |
          $env:MASSIDECK_DATI = "$env:RUNNER_TEMP\md"
          $p = Start-Process python -ArgumentList 'pc/massideck.py','--avvio' -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $ping = Invoke-RestMethod http://127.0.0.1:8765/api/ping
          if ($ping.app -ne 'MassiDeck') { throw 'ping fallito' }
          $cfg = Invoke-RestMethod http://127.0.0.1:8765/api/config
          "Pagine: $($cfg.pagine.Count)"
          $prog = Invoke-RestMethod http://127.0.0.1:8765/api/programmi
          "Programmi nel menu Start: $($prog.programmi.Count)"
          $prog.programmi | Select-Object -First 8 | ForEach-Object { "  " + $_.nome }
          foreach ($az in @(@{tipo='media';valore='vol+'}, @{tipo='media';valore='vol-10'}, @{tipo='tasti';valore='shift'},
                            @{tipo='testo';valore='prova è ok'}, @{tipo='apri';valore='notepad'})) {
            $r = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body (@{azione=$az} | ConvertTo-Json) http://127.0.0.1:8765/api/esegui
            "$($az.tipo) $($az.valore) -> ok=$($r.ok) $($r.errore)"
            if (-not $r.ok) { throw "azione fallita" }
          }
          Stop-Process -Name notepad -ErrorAction SilentlyContinue
          $pc = Invoke-RestMethod http://127.0.0.1:8765/api/pc
          "IP: $($pc.ip -join ', ')  PIN: $($pc.pin)"
          Stop-Process -Id $p.Id
      - name: MassiDeck.exe
        shell: pwsh
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --noconfirm --onefile --noconsole --name MassiDeck --icon icone/massideck.ico --add-data "web;web" pc/massideck.py
          $env:MASSIDECK_DATI = "$env:RUNNER_TEMP\md2"
          $p = Start-Process dist/MassiDeck.exe -ArgumentList '--avvio' -PassThru
          Start-Sleep 6
          $ping = Invoke-RestMethod http://127.0.0.1:8765/api/ping
          $html = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/
          if ($ping.app -ne 'MassiDeck' -or $html.Content -notmatch 'MassiDeck') { throw 'exe non funziona' }
          Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{}' http://127.0.0.1:8765/api/chiudi
          Start-Sleep 2
          Copy-Item dist/MassiDeck.exe MassiDeck.exe
          Get-Item MassiDeck.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with: {name: exe, path: MassiDeck.exe}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Pagina dell'app
        run: python3 build.py
      - name: Progetto Capacitor
        run: |
          mkdir -p app && cd app
          cp -r ../www www
          echo '{"name":"massideck","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"it.massxxx.massideck","appName":"MassiDeck","webDir":"www","server":{"androidScheme":"http","cleartext":true},"android":{"backgroundColor":"#101218"}}' > capacitor.config.json
          npm install --no-audit --no-fund @capacitor/core@$CAP @capacitor/cli@$CAP @capacitor/android@$CAP @capacitor/app@6 @capacitor/status-bar@6
          npx cap add android && npx cap sync android
      - name: Rete di casa, icona, versione
        run: |
          cd app/android
          M=app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic $M || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          grep -q 'usesCleartextTraffic="true"' $M
          grep -q 'android.permission.INTERNET' $M
          rm -rf app/src/main/res/mipmap-anydpi-v26
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../../icone/android/$n.png app/src/main/res/mipmap-$n/ic_launcher.png
            cp ../../icone/android/$n.png app/src/main/res/mipmap-$n/ic_launcher_round.png
            rm -f app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done
          N=${{ github.run_number }}
          sed -i "s/versionCode 1$/versionCode $N/; s/versionName \"1.0\"/versionName \"1.$N\"/" app/build.gradle
          grep -n minSdkVersion variables.gradle || true
      - name: APK
        run: |
          K=$GITHUB_WORKSPACE/android/debug.keystore
          cd app/android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file=$K -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/release/app-release.apk ../../MassiDeck.apk
          ls -la ../../MassiDeck.apk
      - uses: actions/upload-artifact@v4
        with: {name: apk, path: MassiDeck.apk}

  pubblica:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true}
      - name: Pubblica in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la MassiDeck.exe MassiDeck.apk
          N="Versione 1.${{ github.run_number }}.

          PC Windows: scarica MassiDeck.exe e avvialo (se Windows SmartScreen avvisa: «Ulteriori informazioni» › «Esegui comunque»; se il firewall chiede, consenti le reti private).
          Telefono Android: scarica MassiDeck.apk e aprilo per installarlo. Qualsiasi telefono (anche iPhone): apri nel browser l'indirizzo che MassiDeck mostra sul PC."
          gh release view app >/dev/null 2>&1 || gh release create app --title "MassiDeck" --notes "$N" --latest
          gh release upload app MassiDeck.exe MassiDeck.apk --clobber
          gh release edit app --notes "$N" --latest
